# @package _global_

defaults:
  - /model/semantic/spt-3.yaml # SPT on 3 superpoint partition levels
  - /model/semantic/_point_cnn.yaml # EZ-SP uses a CNN in the first stage
  - /experiment/semantic/default_ezsp.yaml
  - /criterion: ce_lovasz_3stages.yaml  # cross-entropy + Lovász-softmax on the first stage
  - /optimizer: muon.yaml  # hybrid Muon/AdamW
  - override /datamodule: semantic/dales_ezsp.yaml
  - override /trainer: gpu.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

trainer:
  max_epochs: 600

model:
  optimizer:
    lr: 0.01  # 0.005 with AdamW before 3.1.0
    weight_decay: 1e-4

  net:
    no_ffn: False
    down_ffn_ratio: 1

logger:
  wandb:
    project: dales_ezsp
    name: semantic